[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "cython>=3.0.3",
  "setuptools>=77",
]

[project]
name = "line_profiler"
description = "Line-by-line profiler"
license = "BSD-3-Clause"
license-files = [
  "LICENSE.txt",
  "LICENSE_Python.txt",
]
authors = [ { name = "Robert Kern", email = "robert.kern@enthought.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dynamic = [
  "dependencies",
  "optional-dependencies",
  "readme",
  "version",
]
urls.Homepage = "https://github.com/pyutils/line_profiler"
scripts.kernprof = "kernprof:main"

[tool.setuptools]
py-modules = [
  "kernprof",
]
include-package-data = true
dynamic.dependencies.file = [
  "requirements/runtime.txt",
]
dynamic.optional-dependencies.all.file = [
  "requirements/optional-metadata.txt",
  "requirements/ipython.txt",
]
dynamic.optional-dependencies.build.file = [
  "requirements/build.txt",
]
dynamic.optional-dependencies.docs.file = [
  "requirements/docs-metadata.txt",
  "requirements/ipython.txt",
]
dynamic.optional-dependencies.ipython.file = [
  "requirements/ipython.txt",
]
dynamic.optional-dependencies.optional.file = [
  "requirements/optional-metadata.txt",
  "requirements/ipython.txt",
]
dynamic.optional-dependencies.tests.file = [
  "requirements/tests.txt",
]
dynamic.readme.file = [
  "README.rst",
]
dynamic.readme.content-type = "text/x-rst"
dynamic.version.attr = "line_profiler.__version__"
package-data.line_profiler = [
  "py.typed",
  "*.pyi",
  "*.toml",
  "rc/*.toml",
]
package-data."*" = [
  "requirements/*.txt",
]
packages.find.where = [
  ".",
]
packages.find.include = [
  "line_profiler*",
]

[[tool.setuptools.ext-modules]]
name = "line_profiler._line_profiler"
sources = [
  "line_profiler/_line_profiler.pyx",
  "line_profiler/timers.c",
  "line_profiler/c_trace_callbacks.c",
]
language = "c++"
depends = [
  "line_profiler/_map_helpers.pxd",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "setup.cfg" },
  { dir = "src" },
  { file = "requirements/*.txt" },
  { file = "README.rst" },
  { file = "line_profiler/__init__.py" },
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "pp* *-musllinux_* cp310-win_arm64"
build-frontend = "build"
build-verbosity = 1
test-command = "python {project}/run_tests.py"
test-extras = [
  "tests",
]
linux.archs = [
  "auto",
]
macos.archs = [
  "x86_64",
  "universal2",
  "arm64",
]
windows.archs = [
  "AMD64",
  "ARM64",
]

[tool.ruff]
target-version = "py310"
line-length = 80
format.indent-style = "space"
format.quote-style = "single"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-format = false
lint.select = [
  "E",
  "F",
  "I",
]
lint.ignore = [
  "E402",
  "E501",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ty]
overrides = [ { include = [
  "line_profiler/line_profiler_utils.py",
], rules.unused-type-ignore-comment = "ignore" } ]
rules.unused-ignore-comment = "ignore"
rules.unused-type-ignore-comment = "ignore"
rules.unresolved-import = "ignore"
terminal.error-on-warning = false

[tool.pytest]
ini_options.addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=dev --ignore-glob=docs"
ini_options.norecursedirs = ".git ignore build __pycache__ dev _skbuild docs"
ini_options.filterwarnings = [
  "default",
  "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning",
  "ignore:.*Define the __nice__ method for.*:Warning",
  "ignore:.*private pytest class or function.*:Warning",
]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  ".*  # nocover",
  ".*  # pragma: no cover",
  ".*if six.PY2:",
  "^ *pass *$",
  "^ *raise",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if _debug:",
  "if 0:",
  "if trace is not None",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "verbose = .*",
]
report.omit = [
  "*/setup.py",
  "line_profiler/__main__.py",
]

[tool.xcookie]
tags = [
  "pyutils",
  "binpy",
  "github",
  "mypy",
  "binpy-ubuntu-arm",
]
mod_name = "line_profiler"
repo_name = "line_profiler"
rel_mod_parent_dpath = "."
os = [
  "all",
  "linux",
  "osx",
  "win",
]
main_python = "3.13"
min_python = "3.10"
max_python = "3.15"
use_setup_py = false
author = "Robert Kern"
author_email = "robert.kern@enthought.com"
description = "Line-by-line profiler"
url = "https://github.com/pyutils/line_profiler"
license = "BSD-3-Clause"
dev_status = "stable"
ci_pypi_trusted_publishing = true
ci_gpg_secret_transport = "direct_ci"
typed = true
skip_autogen = [
  "MANIFEST.in",
  "CHANGELOG.md",
]
test_env = "COVERAGE_CORE: ctrace\n"
workspace_members = []
workspace_sync_versions = false
use_pyproject_requirements = false
entry_points.console_scripts = [
  "kernprof=kernprof:main",
]
